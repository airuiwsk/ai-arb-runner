name: AI Arbitrage Observer

on:
  workflow_dispatch:
  schedule:
    # Watchdog only. The active run self-dispatches its successor.
    - cron: "23 */2 * * *"

permissions:
  actions: write
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PRIVATE_REPO: airuiwsk/AI-Arbitrage
      SOURCE_BRANCH: github-observer
      ARCHIVE_BRANCH: telemetry
    steps:
      - name: Handoff delay
        run: sleep 45

      - name: Elect one active observer
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          PRIVATE_PAT: ${{ secrets.AI_ARBITRAGE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_PAT:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "AI_ARBITRAGE_PAT is not configured; observer remains idle."
            exit 0
          fi
          body="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/arbitrage-observer.yml/runs?status=in_progress&per_page=100")"
          leader="$(printf '%s' "$body" | jq -r '[.workflow_runs[].id] | min')"
          if [ "$leader" != "$GITHUB_RUN_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Another observer run is active; watchdog exits."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private scanner
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          token: ${{ secrets.AI_ARBITRAGE_PAT }}
          path: source
          persist-credentials: false

      - name: Checkout private telemetry archive
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.ARCHIVE_BRANCH }}
          token: ${{ secrets.AI_ARBITRAGE_PAT }}
          path: archive

      - name: Initialize or read seven-day experiment
        if: steps.guard.outputs.skip != 'true'
        id: experiment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          p = Path("archive/data/observer/state.json")
          now = int(time.time())
          if p.exists():
              state = json.loads(p.read_text())
          else:
              p.parent.mkdir(parents=True, exist_ok=True)
              state = {
                  "schema_version": 1,
                  "started_at_unix": now,
                  "ends_at_unix": now + 7 * 24 * 3600,
                  "status": "running",
                  "source_branch": "github-observer",
                  "archive_branch": "telemetry",
              }
              p.write_text(json.dumps(state, indent=2) + "\n")
          remaining = max(0, int(state["ends_at_unix"]) - now)
          run_seconds = min(19200, max(0, remaining - 120))
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as f:
              f.write(f"run_seconds={run_seconds}\n")
              f.write(f"ends_at={state['ends_at_unix']}\n")
              f.write(f"should_run={'true' if run_seconds > 0 else 'false'}\n")
          print(json.dumps(state))
          PY
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observer/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Start AI-Arbitrage observation window"
            REMOTE="https://x-access-token:${{ secrets.AI_ARBITRAGE_PAT }}@github.com/$PRIVATE_REPO.git"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch "$REMOTE" "$ARCHIVE_BRANCH"
              git rebase FETCH_HEAD
              if git push "$REMOTE" HEAD:$ARCHIVE_BRANCH; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            [ "$pushed" = true ] || exit 1
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true' && steps.experiment.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanner
        if: steps.guard.outputs.skip != 'true' && steps.experiment.outputs.should_run == 'true'
        run: python -m pip install -e source

      - name: Run read-only scanner
        if: steps.guard.outputs.skip != 'true' && steps.experiment.outputs.should_run == 'true'
        id: scan
        shell: bash
        env:
          SCAN_INTERVAL_SECONDS: "12"
          MAX_QUOTE_AGE_SECONDS: "30"
          REALTIME_SCANNER_GENERATION: "v2"
          RUN_TOPOLOGY_REDISCOVERY_ON_STARTUP: "1"
          TOPOLOGY_INITIAL_DELAY_SECONDS: "0"
          RUN_V2_VALIDATION_ON_STARTUP: "0"
          RUN_V2_TRANSPORT_BENCHMARK_ON_STARTUP: "0"
          RUN_UPPER_BOUND_VALIDATION_ON_STARTUP: "0"
          RUN_BLOCK_DISPATCH_VALIDATION_ON_STARTUP: "0"
          RUN_ZERO_FLOOR_LIVE_VALIDATION_ON_STARTUP: "0"
          RUN_DEEP_REORG_VALIDATION_ON_STARTUP: "0"
          RUN_RESILIENT_MIRROR_VALIDATION_ON_STARTUP: "0"
          RUN_LIVE_MIRROR_RUNTIME_VALIDATION_ON_STARTUP: "0"
          RUN_STATE_MIRROR_RECOVERY_VALIDATION_ON_STARTUP: "0"
          RUN_STATE_MIRROR_WS_VALIDATION_ON_STARTUP: "0"
          RUN_STATE_MIRROR_VALIDATION_ON_STARTUP: "0"
          RUN_V2_BATCH_EQUIVALENCE_ON_STARTUP: "0"
          ETH_RPC_URL: "https://ethereum-rpc.publicnode.com"
          ETH_RPC_FALLBACK_URL: "https://eth-mainnet.g.alchemy.com/public"
          TELEMETRY_OUTPUT_PATH: "telemetry/latest.json"
          TELEMETRY_HISTORY_DIR: "telemetry/history"
          OPPORTUNITY_EVENT_DIR: "telemetry/opportunities"
          PORT: "10000"
        run: |
          set -euo pipefail
          mkdir -p source/telemetry/history source/telemetry/opportunities archive/data/observer
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd ..

          flush_archive() {
            python source/scripts/compact_observer_archive.py \
              --history-dir source/telemetry/history \
              --opportunity-dir source/telemetry/opportunities \
              --archive-root archive
            cd archive
            git add data/telemetry data/opportunities
            if ! git diff --cached --quiet; then
              git commit -m "Hourly observer flush $GITHUB_RUN_ID"
              REMOTE="https://x-access-token:${{ secrets.AI_ARBITRAGE_PAT }}@github.com/$PRIVATE_REPO.git"
              pushed=false
              for attempt in 1 2 3 4 5; do
                git fetch "$REMOTE" "$ARCHIVE_BRANCH"
                git rebase FETCH_HEAD
                if git push "$REMOTE" HEAD:$ARCHIVE_BRANCH; then
                  pushed=true
                  break
                fi
                sleep $((attempt * 3))
              done
              [ "$pushed" = true ] || exit 1
            fi
            cd ..
          }

          set +e
          (
            cd source
            timeout --signal=TERM --kill-after=30s "${{ steps.experiment.outputs.run_seconds }}s" \
              ai-arbitrage-monitor > "$RUNNER_TEMP/ai-arbitrage-monitor.log" 2>&1
          ) &
          scanner_pid=$!
          set -e

          while kill -0 "$scanner_pid" 2>/dev/null; do
            # Check every 15s so a scanner exit does not delay the workflow by an hour.
            for _ in $(seq 1 240); do
              if ! kill -0 "$scanner_pid" 2>/dev/null; then
                break
              fi
              sleep 15
            done
            flush_archive
          done

          set +e
          wait "$scanner_pid"
          rc=$?
          set -e
          flush_archive

          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ] && [ "$rc" -ne 143 ]; then
            echo "scanner_exit=$rc"
            exit "$rc"
          fi

      - name: Compact and persist telemetry
        if: always() && steps.guard.outputs.skip != 'true' && steps.experiment.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python source/scripts/compact_observer_archive.py             --history-dir source/telemetry/history             --opportunity-dir source/telemetry/opportunities             --archive-root archive
          mkdir -p archive/data/observer
          grep -E 'AI_ARBITRAGE_.*ERROR' "$RUNNER_TEMP/ai-arbitrage-monitor.log" | tail -n 200             > "archive/data/observer/run-$GITHUB_RUN_ID-errors.log" || true
          if [ ! -s "archive/data/observer/run-$GITHUB_RUN_ID-errors.log" ]; then
            rm -f "archive/data/observer/run-$GITHUB_RUN_ID-errors.log"
          fi
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/telemetry data/opportunities data/observer
          if ! git diff --cached --quiet; then
            git commit -m "Archive observer run $GITHUB_RUN_ID"
            REMOTE="https://x-access-token:${{ secrets.AI_ARBITRAGE_PAT }}@github.com/$PRIVATE_REPO.git"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch "$REMOTE" "$ARCHIVE_BRANCH"
              git rebase FETCH_HEAD
              if git push "$REMOTE" HEAD:$ARCHIVE_BRANCH; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            [ "$pushed" = true ] || exit 1
          fi

      - name: Mark experiment complete
        if: always() && steps.guard.outputs.skip != 'true' && steps.experiment.outputs.should_run == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from pathlib import Path
          p = Path("archive/data/observer/state.json")
          state = json.loads(p.read_text())
          state["status"] = "complete"
          state["completed_at_unix"] = int(time.time())
          p.write_text(json.dumps(state, indent=2) + "\n")
          PY
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observer/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Complete AI-Arbitrage observation window"
            REMOTE="https://x-access-token:${{ secrets.AI_ARBITRAGE_PAT }}@github.com/$PRIVATE_REPO.git"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch "$REMOTE" "$ARCHIVE_BRANCH"
              git rebase FETCH_HEAD
              if git push "$REMOTE" HEAD:$ARCHIVE_BRANCH; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            [ "$pushed" = true ] || exit 1
          fi

      - name: Dispatch successor
        if: always() && steps.guard.outputs.skip != 'true' && steps.experiment.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run arbitrage-observer.yml --repo "$GITHUB_REPOSITORY"
