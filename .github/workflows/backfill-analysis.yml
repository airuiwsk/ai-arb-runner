name: AI Arbitrage Backfill Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: airuiwsk/AI-Arbitrage
      ARCHIVE_BRANCH: telemetry
    steps:
      - name: Check private token
        id: guard
        env:
          PRIVATE_PAT: ${{ secrets.AI_ARBITRAGE_PAT }}
        shell: bash
        run: |
          if [ -z "${PRIVATE_PAT:-}" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout telemetry archive
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PRIVATE_REPO }}
          ref: ${{ env.ARCHIVE_BRANCH }}
          token: ${{ secrets.AI_ARBITRAGE_PAT }}
          path: archive
          persist-credentials: false

      - name: Aggregate completed seven-day backfill
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("archive/data/backfill")
          progress=json.loads((root/"progress.json").read_text())
          if progress.get("status")!="complete" or progress.get("completed_blocks")!=progress.get("total_blocks"):
              raise SystemExit("backfill is not complete")

          summaries=sorted((root/"chunks").glob("*.summary.json"))
          total_blocks=0
          candidate_blocks=0
          positive_counts={}
          max_profit_pct={}
          for p in summaries:
              s=json.loads(p.read_text())
              total_blocks += int(s["blocks"])
              candidate_blocks += int(s.get("candidate_blocks",0))
              for k,v in (s.get("positive_counts") or {}).items():
                  positive_counts[k]=positive_counts.get(k,0)+int(v)
              for k,v in (s.get("max_profit_pct") or {}).items():
                  v=float(v)
                  if k not in max_profit_pct or v>max_profit_pct[k]:
                      max_profit_pct[k]=v

          expected=int(progress["total_blocks"])
          if total_blocks != expected:
              raise SystemExit(f"summary block count mismatch: {total_blocks} != {expected}")

          keys=sorted(max_profit_pct)
          routes={}
          for k in keys:
              pos=positive_counts.get(k,0)
              routes[k]={
                  "positive_blocks":pos,
                  "positive_frequency":pos/total_blocks,
                  "max_profit_pct":max_profit_pct[k],
              }

          # Scan compact JSONL exactly when positives exist so we can identify the
          # opportunity block and measure whether it survives +1/+2 blocks.
          no_positive = sum(positive_counts.values()) == 0
          positive_events=[]
          survival_1=0
          survival_2=0
          if not no_positive:
              by_block={}
              for p in sorted((root/"chunks").glob("*.jsonl")):
                  for line in p.read_text().splitlines():
                      if not line.strip(): continue
                      row=json.loads(line)
                      b=int(row["b"])
                      by_block[b]=row
              for b,row in sorted(by_block.items()):
                  for k,raw in (row.get("p") or {}).items():
                      v=float(raw)
                      if v <= 0: continue
                      v1=float((by_block.get(b+1,{}).get("p") or {}).get(k, float("-inf")))
                      v2=float((by_block.get(b+2,{}).get("p") or {}).get(k, float("-inf")))
                      s1=v1>0
                      s2=v2>0
                      survival_1 += int(s1)
                      survival_2 += int(s2)
                      positive_events.append({
                          "block":b,"route_capital":k,"profit_pct":v,
                          "plus_1_profit_pct":None if v1==float("-inf") else v1,
                          "plus_2_profit_pct":None if v2==float("-inf") else v2,
                          "survives_plus_1":s1,"survives_plus_2":s2
                      })
          result={
              "schema_version":1,
              "window_start":progress["window_start"],
              "window_end":progress["window_end"],
              "blocks":total_blocks,
              "chunk_summaries":len(summaries),
              "candidate_blocks":candidate_blocks,
              "routes":routes,
              "any_positive_route_capital_block":not no_positive,
              "positive_survival_plus_1": survival_1,
              "positive_survival_plus_2": survival_2,
              "positive_events": positive_events,
              "survival_note":"Exact sequential JSONL aggregation complete.",
              "read_only":True,
              "execution_enabled":False,
              "ready_for_execution":False,
          }
          (root/"analysis.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")

          lines=[
              "# Seven-day historical backfill analysis","",
              f"- Blocks: {total_blocks:,}",
              f"- Chunk summaries: {len(summaries)}",
              f"- Candidate blocks: {candidate_blocks:,}",
              f"- Any explicit-cost positive route/capital block: {'YES' if not no_positive else 'NO'}","",
              "| Route × capital | Positive blocks | Frequency | Max profit % |",
              "|---|---:|---:|---:|",
          ]
          for k in keys:
              r=routes[k]
              lines.append(f"| {k} | {r['positive_blocks']:,} | {r['positive_frequency']:.6%} | {r['max_profit_pct']:.6f}% |")
          lines += ["",result["survival_note"],""]
          if positive_events:
              lines += ["| Positive block | Route × capital | Profit % | +1 % | +2 % | +1 survives | +2 survives |",
                        "|---:|---|---:|---:|---:|---|---|"]
              for e in positive_events:
                  lines.append(f"| {e['block']} | {e['route_capital']} | {e['profit_pct']:.6f}% | {e['plus_1_profit_pct']} | {e['plus_2_profit_pct']} | {e['survives_plus_1']} | {e['survives_plus_2']} |")
          lines += ["",
                    "Safety: read-only analysis; execution remains disabled."]
          (root/"analysis.md").write_text("\n".join(lines)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY

      - name: Persist analysis
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backfill/analysis.json data/backfill/analysis.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Aggregate seven-day historical backfill"
          REMOTE="https://x-access-token:${{ secrets.AI_ARBITRAGE_PAT }}@github.com/$PRIVATE_REPO.git"
          for attempt in 1 2 3 4 5; do
            git fetch "$REMOTE" "$ARCHIVE_BRANCH"
            git rebase FETCH_HEAD
            if git push "$REMOTE" HEAD:$ARCHIVE_BRANCH; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
